version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - gocognit
    - gocritic
    - nilerr
    - noctx

  settings:
    gocognit:
      min-complexity: 15

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gocognit

formatters:
  enable:
    - gofumpt
    - goimports
